<circle cx="810.0" cy="140.3" r="5" fill="#a47d0e"/>
<circle cx="342" cy="461" r="4" fill="#a47d0e"/>
<text x="353" y="465" font-size="13" text-anchor="start" fill="#253141" font-weight="400">statement</text>
