<text x="90" y="263" font-size="12" text-anchor="end" fill="#253141" font-weight="400">100</text>
<line x1="102" y1="199.6" x2="810" y2="199.6" stroke="#dbe4eb"/>
<text x="90" y="205" font-size="12" text-anchor="end" fill="#253141" font-weight="400">1000</text>
