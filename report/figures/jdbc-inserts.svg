<polyline points="102.0,333.5 456.0,293.8 633.0,237.5 810.0,185.0" fill="none" stroke="#258265" stroke-width="3"/>
<circle cx="102.0" cy="333.5" r="5" fill="#258265"/>
<circle cx="456.0" cy="293.8" r="5" fill="#258265"/>
