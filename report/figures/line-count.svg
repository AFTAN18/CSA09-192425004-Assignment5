<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img">
<title>Unbuffered and block reads for attendance logs</title>
<rect width="880" height="480" fill="#ffffff"/>
<g font-family="Arial, sans-serif">
<text x="102" y="35" font-size="22" text-anchor="start" fill="#253141" font-weight="700">Unbuffered and block reads for attendance logs</text>
<text x="102" y="58" font-size="14" text-anchor="start" fill="#253141" font-weight="400">Mean elapsed milliseconds, log scale</text>
<line x1="102" y1="376.0" x2="810" y2="376.0" stroke="#dbe4eb"/>
<text x="90" y="381" font-size="12" text-anchor="end" fill="#253141" font-weight="400">1</text>
<line x1="102" y1="317.2" x2="810" y2="317.2" stroke="#dbe4eb"/>
<text x="90" y="322" font-size="12" text-anchor="end" fill="#253141" font-weight="400">10</text>
<line x1="102" y1="258.4" x2="810" y2="258.4" stroke="#dbe4eb"/>
<text x="90" y="263" font-size="12" text-anchor="end" fill="#253141" font-weight="400">100</text>
<line x1="102" y1="199.6" x2="810" y2="199.6" stroke="#dbe4eb"/>
<text x="90" y="205" font-size="12" text-anchor="end" fill="#253141" font-weight="400">1000</text>
<line x1="102" y1="140.8" x2="810" y2="140.8" stroke="#dbe4eb"/>
<text x="90" y="146" font-size="12" text-anchor="end" fill="#253141" font-weight="400">10000</text>
<line x1="102" y1="82.0" x2="810" y2="82.0" stroke="#dbe4eb"/>
<text x="90" y="87" font-size="12" text-anchor="end" fill="#253141" font-weight="400">100000</text>
<text x="102" y="400" font-size="12" text-anchor="middle" fill="#253141" font-weight="400">1</text>
<text x="519" y="400" font-size="12" text-anchor="middle" fill="#253141" font-weight="400">10</text>
<text x="810" y="400" font-size="12" text-anchor="middle" fill="#253141" font-weight="400">50</text>
<text x="456" y="421" font-size="14" text-anchor="middle" fill="#253141" font-weight="400">Log size (MiB)</text>
<polyline points="102.0,194.0 518.7,135.4 810.0,93.0" fill="none" stroke="#085f9e" stroke-width="3"/>
<circle cx="102.0" cy="194.0" r="5" fill="#085f9e"/>
<circle cx="518.7" cy="135.4" r="5" fill="#085f9e"/>
<circle cx="810.0" cy="93.0" r="5" fill="#085f9e"/>
<circle cx="102" cy="440" r="4" fill="#085f9e"/>
<text x="113" y="444" font-size="13" text-anchor="start" fill="#253141" font-weight="400">single</text>
<polyline points="102.0,365.0 518.7,321.0 810.0,286.2" fill="none" stroke="#a8491f" stroke-width="3"/>
<circle cx="102.0" cy="365.0" r="5" fill="#a8491f"/>
<circle cx="518.7" cy="321.0" r="5" fill="#a8491f"/>
<circle cx="810.0" cy="286.2" r="5" fill="#a8491f"/>
<circle cx="342" cy="440" r="4" fill="#a8491f"/>
<text x="353" y="444" font-size="13" text-anchor="start" fill="#253141" font-weight="400">buffered</text>
</g></svg>